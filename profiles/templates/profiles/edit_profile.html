{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <h3>Edit Profile</h3>
  <hr />

  <form method="POST">
    {% csrf_token %}
    {{ template_data.form.as_p }}
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-outline-secondary" href="{% url 'profiles.me' %}">Cancel</a>
  </form>
</div>
{% endblock content %}
