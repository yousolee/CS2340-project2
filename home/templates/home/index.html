{% extends 'base.html' %}
{% block content %}
<header class="masthead bg-index text-white text-center
           py-4">
  <div class="container d-flex align-items-center flex-column pt-2">
    <h2>Job Finder</h2>
    <p>Find the perfect job for you!</p>
  </div>
</header>
<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <div class="col mx-auto text-center mb-3">
        <h4>Welcome to Job Finder!!</h4>
        <div class="mt-3">
          {% if user.is_authenticated %}
          <a class="btn btn-success me-2"
             href="{% url 'accounts.dashboard' %}">
            Go to Dashboard
          </a>
          {% endif %}

          <a class="btn btn-primary me-2"
             href="{% url 'jobs.list' %}">
            Browse Jobs
          </a>

          <a class="btn btn-outline-primary"
             href="{% url 'jobs.list' %}">
            Search / Filter
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
