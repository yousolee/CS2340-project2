{% extends "base.html" %}

{% block content %}
  <h2>Apply for: {{ job.title }} at {{ job.company }}</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Submit Application</button>
  </form>
{% endblock %}
