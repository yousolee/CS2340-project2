{% extends 'base.html' %}
{% block content %}
<div class="min-vh-100 py-5" style="background-color: #f0f4f8; background-image: radial-gradient(#c9d6e3 1px, transparent 1px); background-size: 20px 20px;">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="text-center mb-4">
        <h4 class="fw-bold">Welcome back</h4>
        <p class="text-muted">Log in to your account!</p>
      </div>
      <div class="card shadow-sm rounded-3 p-4">
        <div class="card-body">
          {% if template_data.error %}
            <div class="alert alert-danger py-2">{{ template_data.error }}</div>
          {% endif %}
          <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold">Username</label>
              <input id="username" type="text" name="username" required
                     autocomplete="username" class="form-control">
            </div>
            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">Password</label>
              <input id="password" type="password" name="password" required
                     autocomplete="current-password" class="form-control">
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Login</button>
            </div>
          </form>
          <p class="text-center text-muted mt-3 mb-0 small">
            No account? <a href="{% url 'accounts.signup' %}">Sign Up</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
