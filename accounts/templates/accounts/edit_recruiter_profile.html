{% extends 'base.html' %}
{% block content %}
<div style="background-color: #f5f6fa; min-height: 100vh;">
  <div class="container py-4" style="max-width: 600px;">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h5 class="fw-bold mb-4">Company Profile</h5>
        <form method="POST" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold small">Company Name</label>
            {{ form.company_name }}
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold small">Company Logo</label>
            {% if form.instance.logo %}
              <div class="mb-2">
                <img src="{{ form.instance.logo.url }}" alt="Current logo" style="height: 48px; object-fit: contain;">
              </div>
            {% endif %}
            {{ form.logo }}
          </div>
          <button type="submit" class="btn text-white fw-semibold" style="background: linear-gradient(135deg, #1a1a2e, #0f3460);">
            Save
          </button>
          <a href="{% url 'accounts.dashboard' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
